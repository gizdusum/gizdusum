<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Numen Cash — tokens with a mind of their own. Founder: Gizdusum.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F29A1F"/>
      <stop offset="0.55" stop-color="#FFBB62"/>
      <stop offset="1" stop-color="#FFCD83"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#FFF3D6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFF3D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241500"/>
      <stop offset="1" stop-color="#3a2408"/>
