  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>
  <g fill="#241500" opacity="0.35">
    <circle cx="1040" cy="60" r="2"/><circle cx="1110" cy="110" r="1.5"/><circle cx="980" cy="140" r="1.5"/>
    <circle cx="1180" cy="70" r="2.5"/><circle cx="1210" cy="190" r="1.5"/><circle cx="1090" cy="250" r="2"/>
    <circle cx="1160" cy="300" r="1.5"/><circle cx="1010" cy="300" r="1.5"/><circle cx="930" cy="80" r="1.5"/>
  </g>
