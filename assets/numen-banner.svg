    <text x="396" y="196" font-size="88" font-weight="800" letter-spacing="-2">NUMEN CASH</text>
    <text x="400" y="246" font-size="30" font-weight="600" opacity="0.85">Tokens with a mind of their own.</text>
    <text x="400" y="296" font-size="20" font-weight="600" letter-spacing="2" opacity="0.7">LIVE ON GIWA SEPOLIA TESTNET · NUMEN.CASH</text>
