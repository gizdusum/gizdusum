  <g transform="translate(150 70)">
    <path d="M0 220 V100 A90 90 0 0 1 180 100 V220" fill="none" stroke="url(#arch)" stroke-width="26" stroke-linecap="butt"/>
    <circle cx="90" cy="135" r="34" fill="#FFF3D6" opacity="0.9"/>
